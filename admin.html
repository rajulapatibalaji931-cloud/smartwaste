<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard | SmartWaste</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="navbar"></div><main class="py-5"><div class="container-fluid px-lg-5">
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4"><div><span class="eyebrow">ADMINISTRATION</span><h2>Operations Dashboard</h2></div><a href="bins.html" class="btn btn-outline-success"><i class="fa-solid fa-trash-can me-2"></i>Manage Bins</a></div>
<div class="row g-3 mb-4">
<div class="col-6 col-xl-3"><div class="dashboard-stat"><i class="fa-solid fa-file-lines"></i><div><span>Total Complaints</span><h3 id="totalC">0</h3></div></div></div>
<div class="col-6 col-xl-3"><div class="dashboard-stat"><i class="fa-solid fa-clock"></i><div><span>Pending</span><h3 id="pendingC">0</h3></div></div></div>
<div class="col-6 col-xl-3"><div class="dashboard-stat"><i class="fa-solid fa-circle-check"></i><div><span>Resolved</span><h3 id="resolvedC">0</h3></div></div></div>
<div class="col-6 col-xl-3"><div class="dashboard-stat"><i class="fa-solid fa-trash-can"></i><div><span>Total Bins</span><h3>5</h3></div></div></div></div>
<div class="row g-4">
<div class="col-xl-8"><div class="content-card"><div class="card-title-row"><h4>Complaint Management</h4><div class="d-flex gap-2"><select id="statusFilter" class="form-select form-select-sm"><option value="">All Statuses</option><option>Pending</option><option>In Progress</option><option>Resolved</option></select><input id="areaFilter" class="form-control form-control-sm" placeholder="Filter area"></div></div>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>Citizen</th><th>Location</th><th>Waste</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminComplaints"></tbody></table></div></div></div>
<div class="col-xl-4"><div class="content-card"><div class="card-title-row"><h4>Complaint Statistics</h4></div><div class="chart-wrap"><canvas id="complaintChart"></canvas></div></div></div>
<div class="col-12"><div class="content-card"><div class="card-title-row"><h4>Bin Monitoring</h4><a href="bins.html">Detailed view</a></div><div class="row g-3" id="binCards"></div></div></div>
</div></div></main><div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/data.js"></script><script src="js/common.js"></script><script src="js/admin.js"></script></body></html>
