<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citizen Dashboard | SmartWaste</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="navbar"></div><main class="py-5"><div class="container">
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4"><div><span class="eyebrow">CITIZEN PORTAL</span><h2>Welcome, <span id="userName">Citizen</span></h2></div><span class="badge bg-success-subtle text-success p-2"><i class="fa-solid fa-shield-halved me-1"></i> Citizen Account</span></div>
<div class="row g-4 mb-4"><div class="col-md-4"><div class="dashboard-stat"><i class="fa-solid fa-file-circle-exclamation"></i><div><span>Total Complaints</span><h3 id="myTotal">0</h3></div></div></div><div class="col-md-4"><div class="dashboard-stat"><i class="fa-solid fa-hourglass-half"></i><div><span>Pending / Active</span><h3 id="myPending">0</h3></div></div></div><div class="col-md-4"><div class="dashboard-stat"><i class="fa-solid fa-circle-check"></i><div><span>Resolved</span><h3 id="myResolved">0</h3></div></div></div></div>
<div class="row g-4">
<div class="col-lg-5"><div class="content-card h-100"><div class="card-title-row"><h4><i class="fa-solid fa-flag me-2 text-success"></i>Submit Waste Complaint</h4></div><div id="complaintAlert"></div>
<form id="complaintForm">
<label>Location</label><input id="location" class="form-control mb-3" required placeholder="e.g. ALFA, Ward 12">
<label>Type of Waste</label><select id="wasteType" class="form-select mb-3" required><option value="">Select type</option><option>Household Waste</option><option>Plastic Waste</option><option>Construction Waste</option><option>Organic Waste</option><option>Mixed Waste</option><option>Other</option></select>
<label>Description</label><textarea id="description" class="form-control mb-3" rows="4" required minlength="10" placeholder="Describe the issue..."></textarea>
<label>Photo (optional)</label><input id="photo" type="file" accept="image/*" class="form-control mb-3">
<button class="btn btn-success w-100"><i class="fa-solid fa-paper-plane me-2"></i>Submit Complaint</button></form></div></div>
<div class="col-lg-7"><div class="content-card"><div class="card-title-row"><h4><i class="fa-solid fa-map-location-dot me-2 text-success"></i>Nearby Bin Locations</h4><a href="bins.html" class="small">View all</a></div><div id="map"></div><div id="binLegend" class="small mt-3"></div></div></div>
<div class="col-12"><div class="content-card"><div class="card-title-row"><h4><i class="fa-solid fa-list-check me-2 text-success"></i>My Complaints</h4></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>Location</th><th>Waste Type</th><th>Date</th><th>Status</th></tr></thead><tbody id="myComplaints"></tbody></table></div></div></div>
</div></div></main><div id="footer"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/data.js"></script><script src="js/common.js"></script><script src="js/dashboard.js"></script></body></html>
