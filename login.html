<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citizen Login | SmartWaste</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="navbar"></div>
<main class="auth-page"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="auth-card"><div class="text-center mb-4"><div class="auth-icon"><i class="fa-solid fa-user"></i></div><h2>Citizen Login</h2><p class="text-muted">Access your SmartWaste dashboard</p></div>
<div id="loginAlert"></div>
<form id="loginForm"><div class="mb-3"><label>Email</label><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-envelope"></i></span><input id="email" type="email" class="form-control" required></div></div>
<div class="mb-3"><label>Password</label><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-lock"></i></span><input id="password" type="password" class="form-control" required></div></div>
<button class="btn btn-success w-100 py-2">Login</button></form>
<p class="text-center mt-4 mb-0">New citizen? <a href="register.html">Create an account</a></p>

</div></div></div></div></main><div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/data.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
