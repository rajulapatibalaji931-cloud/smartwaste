<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | SmartWaste</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="navbar"></div><main class="auth-page"><div class="container"><div class="row justify-content-center"><div class="col-lg-8">
<div class="auth-card"><div class="text-center mb-4"><div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div><h2>Create Citizen Account</h2><p class="text-muted">Join the movement for cleaner cities</p></div><div id="registerAlert"></div>
<form id="registerForm" class="row g-3">
<div class="col-md-6"><label>Full Name</label><input id="name" class="form-control" required></div>
<div class="col-md-6"><label>Email</label><input id="email" type="email" class="form-control" required></div>
<div class="col-md-6"><label>Phone</label><input id="phone" pattern="[0-9]{10}" class="form-control" required></div>
<div class="col-md-6"><label>Address</label><input id="address" class="form-control" required></div>
<div class="col-md-6"><label>Password</label><input id="password" type="password" minlength="6" class="form-control" required></div>
<div class="col-md-6"><label>Confirm Password</label><input id="confirm" type="password" class="form-control" required></div>
<div class="col-12"><button class="btn btn-success w-100 py-2">Create Account</button></div>
</form><p class="text-center mt-4 mb-0">Already registered? <a href="login.html">Login</a></p></div></div></div></div></main><div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/data.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
